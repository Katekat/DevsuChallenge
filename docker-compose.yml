

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_MEMORY_HIGH_WATERMARK=0.8
    mem_limit: 512m

  usuarios-api:
    build:
      context: .
      dockerfile: src/Devsu.Usuarios.API/Dockerfile
    restart: on-failure
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__UsuariosDb=Server=sqlserver;Database=DevsuUsuarios;User=sa;Password=Password123!;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  financiero-api:
    build:
      context: .
      dockerfile: src/Devsu.Financiero.API/Dockerfile
    restart: on-failure
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__FinancieroDb=Server=sqlserver;Database=DevsuFinanciero;User=sa;Password=Password123!;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
volumes:
    sqlserver_data:
